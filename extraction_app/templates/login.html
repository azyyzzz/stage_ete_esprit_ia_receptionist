<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - Extraction KB ESPRIT</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
</head>
<body>
  <main class="login-page">
    <form class="login-form" method="post" action="/login">
      <div class="login-brand">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181f" stroke="rgba(255,255,255,0.1)"/>
          <path d="M8 20.5V11.5C8 10.1193 9.11929 9 10.5 9H21.5C22.8807 9 24 10.1193 24 11.5V17.5C24 18.8807 22.8807 20 21.5 20H14L10 23.5V20.5H8Z" fill="#f0342a"/>
          <path d="M11 15.5L13 13L15 16.5L17.5 11.5L19.5 15.5L21.5 14" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        </svg>
        <h1>Extraction KB ESPRIT</h1>
      </div>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <label for="username">Utilisateur</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
